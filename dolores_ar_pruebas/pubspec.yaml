name: dolores_ar
description: App turística con realidad aumentada para visitar Dolores Hidalgo (paquete de pruebas).
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  geolocator: ^14.1.2
  model_viewer_plus: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
